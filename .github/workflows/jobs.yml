on:
  workflow_dispatch:

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
    - name: job 1 runs
      run: echo ${{ github.job }} 

  job_2:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
    - name: job 2 runs
      run: echo "hello 2"
      
  job_3:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
    - name: job 3 runs
      run: echo "hello 3"

  job_4:
    runs-on: ubuntu-latest
    needs:
      - job_2
      - job_3
    steps:
    - name: job 4 runs
      run: echo "hello 4"
